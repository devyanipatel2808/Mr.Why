<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Secret Birthday Mission 💖</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      min-height: 100vh;
      width: 100vw;
      background: radial-gradient(circle at center, #1e1b4b, #0f172a, #020617);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 30px 25px;
      width: 100%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      animation: fadeIn 0.8s ease-in-out;
    }
    .lock-icon {
      font-size: 48px;
      margin-bottom: 10px;
      filter: drop-shadow(0 4px 10px rgba(236, 72, 153, 0.3));
    }
    .step-indicator {
      font-size: 13px;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
      font-weight: 700;
    }
    .question-box {
      background: rgba(236, 72, 153, 0.12);
      border: 1px solid rgba(236, 72, 153, 0.3);
      border-radius: 16px;
      padding: 18px 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.1);
    }
    h2 {
      font-size: 20px;
      color: #f8fafc;
      line-height: 1.4;
      font-weight: 600;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.7);
      color: #fff;
      font-size: 16px;
      outline: none;
      text-align: center;
      transition: all 0.3s ease;
    }
    input[type="text"]:focus {
      border-color: #ec4899;
      box-shadow: 0 0 12px rgba(236, 72, 153, 0.4);
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.4);
      transition: all 0.2s ease-in-out;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.6);
    }
    .error-msg {
      color: #f87171;
      font-size: 14px;
      margin-top: 12px;
      min-height: 20px;
      font-weight: 500;
    }
    #secret-container {
      display: none;
    }
    .birthday-img {
      width: 100%;
      max-width: 320px;
      height: auto;
      border-radius: 18px;
      border: 4px solid #fbbf24;
      margin: 18px auto;
      display: block;
      box-shadow: 0 10px 30px rgba(251, 191, 36, 0.35);
    }
    .wish-text {
      font-size: 22px;
      font-weight: bold;
      color: #fef08a;
      margin-top: 15px;
      line-height: 1.4;
      text-shadow: 0 2px 10px rgba(251, 191, 36, 0.3);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Quiz Card -->
  <div class="card" id="quiz-card">
    <div class="lock-icon">🔒</div>
    <div class="step-indicator" id="step-count">Question 1 of 5</div>
    
    <!-- Styled Question Box -->
    <div class="question-box">
      <h2 id="question-text">Loading question...</h2>
    </div>

    <input type="text" id="answer-input" placeholder="Type your answer here..." autocomplete="off">
    <button onclick="checkAnswer()">💖</button>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <!-- Secret Unlock Card -->
  <div class="card" id="secret-container">
    <div class="lock-icon">💖🔓💖</div>
    <h2> you are won mr why 💕</h2>
    <img src="photo.jpg" alt="Birthday Photo" class="birthday-img" id="secret-photo">
    <div class="wish-text">Many Many Happy Returns Of The day Mr.Why 🥳🔥❤️</div>
  </div>

  <script>
    const quizData = [
      { question: "When did our first chat start?", answer: "7 july" },
      { question: "Our first meet date?", answer: "18 july" },
      { question: "My favourite colour?", answer: "red" },
      { question: "My birthday date?", answer: "21 nov" },
      { question: "Where do I want to go after my marriage?", answer: "kedarnath" }
    ];

    let currentStep = 0;

    function loadQuestion() {
      document.getElementById('step-count').innerText = `Question ${currentStep + 1} of ${quizData.length}`;
      document.getElementById('question-text').innerText = quizData[currentStep].question;
      document.getElementById('answer-input').value = '';
      document.getElementById('error-msg').innerText = '';
    }

    function checkAnswer() {
      const userInput = document.getElementById('answer-input').value.trim().toLowerCase();
      const correctAnswer = quizData[currentStep].answer.toLowerCase();

      if (userInput === correctAnswer) {
        currentStep++;
        if (currentStep < quizData.length) {
          loadQuestion();
        } else {
          revealSecret();
        }
      } else {
        document.getElementById('error-msg').innerText = "Wrong answer! Try again. ❌";
      }
    }

    document.getElementById('answer-input').addEventListener('keypress', function(event) {
      if (event.key === 'Enter') {
        checkAnswer();
      }
    });

    function triggerCrackers() {
      var duration = 3.5 * 1000;
      var animationEnd = Date.now() + duration;
      var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 999 };

      var interval = setInterval(function() {
        var timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) {
          return clearInterval(interval);
        }
        var particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
    }

    function randomInRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    function revealSecret() {
      document.getElementById('quiz-card').style.display = 'none';
      document.getElementById('secret-container').style.display = 'block';
      triggerCrackers();
    }

    loadQuestion();
  </script>
</body>
</html>
